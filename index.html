<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CYBER BLADE // Bullet Slicer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #070714; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #hud { display: flex; justify-content: space-between; width: 420px; font-weight: 800; font-size: 16px; letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 0 10px #00ffcc; }
    canvas { background: radial-gradient(circle at center, #11142e 0%, #060712 100%); border: 2px solid #00ffcc; border-radius: 12px; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4); cursor: crosshair; touch-action: none; }
    #tips { margin-top: 12px; font-size: 13px; color: #8892b0; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div id="hud">
    <div style="color: #00ffcc;">SCORE: <span id="score">0</span></div>
    <div style="color: #ff007f;">HP: <span id="hp">100</span>%</div>
    <div style="color: #ffe600;">BEST: <span id="best">0</span></div>
  </div>
  <canvas id="c" width="420" height="540"></canvas>
  <div id="tips">SLICE ORBS / BULLETS BY DRAGGING YOUR CURSOR / TOUCH!</div>
  <script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score'), hpEl = document.getElementById('hp'), bestEl = document.getElementById('best');
    let score = 0, hp = 100, best = parseInt(localStorage.getItem('cb_best') || 0);
    bestEl.innerText = best;
    let trail = [], enemies = [], particles = [], gameOver = false, frame = 0;

    class Enemy {
      constructor() {
        this.r = 16 + Math.random() * 8;
        this.x = this.r + Math.random() * (canvas.width - this.r * 2);
        this.y = -20;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = 2 + Math.random() * 3 + score * 0.03;
        this.color = Math.random() > 0.3 ? '#ff007f' : '#ffe600';
      }
      update() { this.x += this.vx; this.y += this.vy; }
      draw() {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.life = 1;
      }
      update() { this.x += this.vx; this.y += this.vy; this.life -= 0.04; }
      draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function checkSlice(p1, p2) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dist = Math.hypot(e.x - p2.x, e.y - p2.y);
        if (dist < e.r + 14) {
          for (let p = 0; p < 12; p++) particles.push(new Particle(e.x, e.y, e.color));
          enemies.splice(i, 1);
          score += 10;
          scoreEl.innerText = score;
          if (score > best) { best = score; bestEl.innerText = best; localStorage.setItem('cb_best', best); }
        }
      }
    }

    function addTrail(x, y) {
      trail.push({ x, y, life: 1 });
      if (trail.length > 1) checkSlice(trail[trail.length - 2], trail[trail.length - 1]);
    }

    window.addEventListener('pointermove', e => {
      const rect = canvas.getBoundingClientRect();
      if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
        addTrail(e.clientX - rect.left, e.clientY - rect.top);
      }
    });

    window.addEventListener('pointerdown', e => {
      if (gameOver) {
        score = 0; hp = 100; gameOver = false; enemies = []; particles = [];
        scoreEl.innerText = 0; hpEl.innerText = 100;
        return;
      }
      const rect = canvas.getBoundingClientRect();
      addTrail(e.clientX - rect.left, e.clientY - rect.top);
    });

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;
      if (!gameOver && frame % Math.max(18, 50 - Math.floor(score / 20)) === 0) enemies.push(new Enemy());

      // Update & Draw Trail
      for (let i = 0; i < trail.length; i++) trail[i].life -= 0.08;
      trail = trail.filter(t => t.life > 0);
      if (trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00ffcc';
        ctx.stroke();
      }

      // Update & Draw Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.update(); e.draw();
        if (e.y > canvas.height + 20) {
          enemies.splice(i, 1);
          if (!gameOver) {
            hp -= 15;
            if (hp <= 0) { hp = 0; gameOver = true; }
            hpEl.innerText = hp;
          }
        }
      }

      // Update & Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(); particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(7, 7, 20, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff007f';
        ctx.font = '900 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CORE BREACH', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#00ffcc';
        ctx.font = '16px sans-serif';
        ctx.fillText('CLICK OR TAP TO REBOOT SYSTEM', canvas.width / 2, canvas.height / 2 + 25);
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
